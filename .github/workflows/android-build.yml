name: Kompilo Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Liferimi i Kodit (Checkout)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pastrimi i SDK-ve problematike (35 dhe 36)
        run: |
          rm -rf "$ANDROID_SDK_ROOT/platforms/android-35"*
          rm -rf "$ANDROID_SDK_ROOT/platforms/android-36"*

      - name: Vendosja e Mjedisit Qt (Desktop)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.1'
          target: 'desktop'
          arch: 'gcc_64'

      - name: Vendosja e Mjedisit Qt Android
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.1'
          target: 'android'
          arch: 'android_arm64_v8a'

      - name: Konfigurimi me CMake
        run: |
          qt-cmake -S kryesor-android -B build -DCMAKE_BUILD_TYPE=Debug \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" \
            -DQT_HOST_PATH="/home/runner/work/biblioteka/Qt/6.6.1/gcc_64" \
            -DANDROID_PLATFORM=android-34 \
            -DQT_ANDROID_COMPILE_SDK_VERSION=34 \
            -DQT_ANDROID_TARGET_SDK_VERSION=34

      - name: Ndërtimi i APK-së
        run: |
          cmake --build build --target apk

      - name: Ruajtja e APK-së si Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biblioteka-apk
          path: build/**/*.apk
