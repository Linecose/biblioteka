name: Kompilo Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Liferimi i Kodit (Checkout)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Vendosja e Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Vendosja e Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Vendosja e Mjedisit Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.1'
          target: 'android'
          arch: 'android_arm64_v8a'

      - name: Konfigurimi me CMake
        run: |
          qt-cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Ndërtimi i APK-së
        run: |
          cmake --build build --target apk

      - name: Ruajtja e APK-së si Artifact
        uses: actions/upload-artifact@v4
        with:
          name: biblioteka-apk
          path: build/**/*.apk
